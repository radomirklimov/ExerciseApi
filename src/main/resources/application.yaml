spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  #    url: jdbc:postgresql://localhost:5432/organizer_db
  #    username: postgres
  #    password: changeit

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  properties:
    hibernate:
      format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: "health, info"

server:
  address: 0.0.0.0
